<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#1b2338"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- decorative bank/.fspro glyphs -->
  <g opacity="0.08" fill="#ffffff" font-family="Consolas, monospace" font-size="22">
    <text x="40" y="90">RIFF FEV  EVTS EVTB WAIS MUIS WAVS</text>
    <text x="40" y="600">STDT PMLB EVIS FSB5 .bank .fspro</text>
    <text x="720" y="600">GUID 7e0b6612-8b83-432a-b8b9-5f9534882f4b</text>
  </g>

  <!-- title -->
  <text x="80" y="230" fill="#ffffff" font-size="76" font-weight="700">ReBank</text>
  <rect x="80" y="252" width="620" height="6" rx="3" fill="url(#acc)"/>

  <!-- tagline -->
  <text x="80" y="320" fill="#c9d3e6" font-size="30">Compiled FMOD Studio .bank files → named samples</text>
  <text x="80" y="364" fill="#c9d3e6" font-size="30">and an editable .fspro project. Names and GUIDs intact. Created with AI.</text>

  <!-- chain -->
  <g font-family="Consolas, monospace" font-size="22" font-weight="600">
    <rect x="80" y="420" width="170" height="48" rx="10" fill="#223052" stroke="#3b4f7a"/>
    <text x="165" y="451" fill="#e6ecff" text-anchor="middle">.bank</text>
    <text x="268" y="451" fill="#6ea8fe" text-anchor="middle">→</text>
    <rect x="292" y="420" width="260" height="48" rx="10" fill="#223052" stroke="#3b4f7a"/>
    <text x="422" y="451" fill="#e6ecff" text-anchor="middle">strings → events</text>
    <text x="570" y="451" fill="#6ea8fe" text-anchor="middle">→</text>
    <rect x="594" y="420" width="300" height="48" rx="10" fill="#223052" stroke="#3b4f7a"/>
    <text x="744" y="451" fill="#e6ecff" text-anchor="middle">samples + parameters</text>
    <text x="912" y="451" fill="#6ea8fe" text-anchor="middle">→</text>
    <rect x="936" y="420" width="200" height="48" rx="10" fill="#2b3d6b" stroke="#6ea8fe"/>
    <text x="1036" y="451" fill="#ffffff" text-anchor="middle">.fspro</text>
  </g>

  <!-- feature chips -->
  <g font-size="22" fill="#c9d3e6">
    <rect x="80" y="510" width="270" height="42" rx="21" fill="none" stroke="#3b4f7a"/>
    <text x="215" y="538" text-anchor="middle">zero core dependencies</text>
    <rect x="366" y="510" width="270" height="42" rx="21" fill="none" stroke="#3b4f7a"/>
    <text x="501" y="538" text-anchor="middle">vanilla backfill (--game)</text>
    <rect x="652" y="510" width="270" height="42" rx="21" fill="none" stroke="#3b4f7a"/>
    <text x="787" y="538" text-anchor="middle">parameter sheets</text>
    <rect x="938" y="510" width="262" height="42" rx="21" fill="none" stroke="#3b4f7a"/>
    <text x="1069" y="538" text-anchor="middle">FMOD Studio 2.02</text>
  </g>
</svg>
