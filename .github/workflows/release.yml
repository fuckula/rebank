name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows standalone binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[decode]" pyinstaller pyogg
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --noconfirm rebank.spec
      - name: Smoke test binary
        shell: pwsh
        run: |
          .\dist\rebank.exe --version
          .\dist\rebank.exe --help | Out-Null
          $hash = (Get-FileHash .\dist\rebank.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  rebank.exe" | Set-Content -Encoding ascii .\dist\rebank.exe.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebank-windows
          path: |
            dist/rebank.exe
            dist/rebank.exe.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rebank.exe
            dist/rebank.exe.sha256
