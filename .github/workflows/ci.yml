name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core only, no dependencies)
        run: pip install -e .
      - name: Lint
        run: |
          pip install ruff
          ruff check . --output-format=github
      - name: Unit tests (synthetic banks, no game assets)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: fbu --help
